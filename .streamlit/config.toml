# "Sage" — Sage Hint / Sage / Moss / Evergreen.
# Deliberately distinct from the other portfolio's wine-and-gilt, so two
# dashboards open in adjacent tabs cannot be mistaken for each other. The app
# also injects the palette from config at runtime; this file covers the chrome
# Streamlit paints before any Python runs.
#
# One value here is derived rather than supplied: the palette is entirely
# mid-to-light greens with no near-black, and a dark theme needs a page
# background darker than its darkest brand colour. backgroundColor is Evergreen
# taken down to a near-black with the same green cast. Every supplied colour
# still does real work — Evergreen is the card/input surface, Moss the
# interactive accent, Sage Hint the body text.

[theme]
base = "dark"
primaryColor = "#738A6E"          # Moss — buttons, sliders, focus
backgroundColor = "#18211B"       # derived: Evergreen as a near-black
secondaryBackgroundColor = "#344C3D"   # Evergreen — cards, inputs, table heads
textColor = "#BFCFBB"             # Sage Hint
font = "serif"

[server]
# Set explicitly rather than left to a default that could change.
enableXsrfProtection = true
enableCORS = true
headless = true

[browser]
gatherUsageStats = false

[client]
# A traceback can carry a DataFrame repr, and a repr can carry positions.
# Never render exception details in the browser.
showErrorDetails = "none"
toolbarMode = "minimal"
