# "Rich Romance" — Caviar / Vaporous Gray / Anemone / Mauvewood / Gilded Beige.
# Deliberately distinct from the reference's gold-on-black. The app also injects
# the palette from config at runtime; this file covers the chrome Streamlit
# paints before any Python runs.

[theme]
base = "dark"
primaryColor = "#8E2749"          # Anemone
backgroundColor = "#221C20"       # Caviar
secondaryBackgroundColor = "#2C242A"
textColor = "#DED8CE"             # Vaporous Gray
font = "serif"

[server]
# Set explicitly rather than left to a default that could change.
enableXsrfProtection = true
enableCORS = true
headless = true

[browser]
gatherUsageStats = false

[client]
# A traceback can carry a DataFrame repr, and a repr can carry positions.
# Never render exception details in the browser.
showErrorDetails = "none"
toolbarMode = "minimal"
